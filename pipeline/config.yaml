# pipeline/config.yaml
#
# Source folders are populated — ZIPs were downloaded manually and extracted.
# Run Phase 2 pipeline scripts once this file is fully configured.
#
# BEFORE PHASE 3 UPLOAD:
#   Update R2 credentials in environment variables (see upload.py).
#   Event time windows go in the pipeline.events section (added in Phase 2).

sources:
  # Four source folders: 3 photographers, Abir Sultan split into digital + film.
  # abir_sultan and abir_sultan_film share the same photographer label so they
  # appear as one photographer in the gallery filter.
  local_sources:
    - label: abir_sultan
      output_dir: sources/abir_sultan
      has_exif: true
      camera_utc_offset_hours: 2    # camera set to IST (GMT+2) — not adjusted for DST

    - label: abir_sultan
      output_dir: sources/abir_sultan_film
      has_exif: false               # film scans — no EXIF timestamps; routed to CLIP KNN

    - label: inbal_zeldin
      output_dir: sources/inbal_zeldin
      has_exif: true
      camera_utc_offset_hours: 3    # camera correctly set to IDT (GMT+3)

    - label: magnate_images
      output_dir: sources/magnate_images
      has_exif: true
      camera_utc_offset_hours: 3    # OffsetTimeOriginal tag says +00:00 but actual IDT (GMT+3)

  pic_time:
    gallery_url: "https://justsmile.pic-time.com/gallery"
    output_dir: sources/pic_time

photographers:
  - label: abir_sultan
    display_name: "עביר סולטן"

  - label: inbal_zeldin
    display_name: "ענבל זלדין"

  - label: magnate_images
    display_name: "Magnate Images"

pipeline:
  confidence_threshold: 0.7       # minimum cluster_confidence for Phase 2 cluster review
  event_timezone_offset_hours: 2  # time windows defined in GMT+2 (abir_sultan clock reference)
  events:
    time_windows:
      prep:
        start: "08:00"
        end: "14:00"
      photoshooting:
        start: "14:00"
        end: "16:10"
      dining:
        start: "16:10"
        end: "18:00"
      hupa:
        start: "18:00"
        end: "18:40"
      dancing:
        start: "18:40"
        end: "23:59"

# R2 non-secret config. Credentials come from env vars:
#   R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY (see upload.py)
r2:
  bucket: "your-bucket-name"
  endpoint: "https://ACCOUNT_ID.r2.cloudflarestorage.com"
  r2_public_url: "https://pub-REPLACE_ME.r2.dev"
